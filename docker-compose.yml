version: "3.8"

services:
    postgres:
        image: postgres:${POSTGRES_VERSION:-alpine}
        container_name: postgres
        restart: always
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-faume}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faume}
            POSTGRES_USER: ${POSTGRES_USER:-faume}
        ports:
            - 5432:5432
        volumes:
            - ./.volumes/postgres/data/:/var/lib/postgresql/data/:rw

    mariadb:
        image: mariadb:${MARIADB_VERSION:-latest}
        container_name: mariadb
        environment:
            MARIADB_ROOT_PASSWORD: root
        ports:
            - 3306:3306
        volumes:
            - ./.volumes/mariadb/:/var/lib/mysql/:rw

    redis:
        image: redis:${POSTGRES_VERSION:-alpine}
        container_name: redis
        restart: always
        ports:
            - 6379:6379
  
    rabbitmq:
        image: rabbitmq:${RABBITMQ_VERSION:-management-alpine}
        container_name: rabbitmq
        restart: always
        ports:
            - 5672:5672
            - 15672:15672
        volumes:
            - ./.volumes/rabbitmq/data/:/var/lib/rabbitmq/mnesia/:rw
